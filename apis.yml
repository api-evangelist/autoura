  - aid: autoura:autoura-mcp
    name: Autoura MCP Server
    description: >-
      Autoura's hosted remote Model Context Protocol server, the surface it builds
      for AI agents first. One endpoint carries two permission-scoped tool sets: a
      B2B set for brands, attractions, tour operators, destinations, designers and
      suppliers managing experience data, and a consumer set (PlanMyVisit) for agents
      helping a person plan and carry out a single real-world visit. Authorization is
      OAuth 2.1 with PKCE and dynamic client registration, advertised through a
      conformant RFC 9728 protected-resource document; Autoura also documents an
      email-verification-code path to a 48-hour bearer token for agents onboarding a
      human account. The same tool set is exposed as WebMCP on PlanMyVisit pages.
    humanURL: https://www.autoura.com/docs/api/mcp
    baseURL: https://api.autoura.com/api/mcp
