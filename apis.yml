aid: autoura
name: Autoura
description: >-
  Autoura is a UK digital experience platform (DXP) for real-world tourism and
  travel experiences, operated by The Spontaneous Travel Company Limited. It
  structures and maintains experience data — venues, attractions, tours, routes,
  stops, accessibility and dietary signals, AI guide characters and storytelling —
  so travel companies, destination management organizations and, increasingly, AI
  agents can act on it. Autoura is agent-native rather than agent-adjacent: it
  advertises its own agent skill from a link rel="ai-skill" element in its homepage
  head, runs a hosted remote MCP server behind OAuth 2.1 with PKCE and dynamic
  client registration, exposes the same tool set as WebMCP on its PlanMyVisit
  consumer product, and addresses consumer profiles by DID with DIDComm v2
  messaging. A REST API over api.autoura.com serves routes, stops, visits,
  characters, MoveMe audio and a consent-brokered consumer preference graph, with
  dietary requirements keyed on IATA airline special-meal codes.
