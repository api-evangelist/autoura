divergence_note: >-
  The two surfaces are NOT projections of one core. REST is the B2B content and
  consent surface (routes, stops, entities, preference brokering); MCP is the
  agent-and-consumer surface, and the entire visit-plan object model -- the thing
  PlanMyVisit is for -- exists ONLY over MCP. An integrator who reads only the REST
  reference will not know visit plans exist.
