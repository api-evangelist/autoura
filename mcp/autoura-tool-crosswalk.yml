note: >-
  Autoura publishes NO OpenAPI, so this crosswalk cannot bind tools to operationIds
  the way the reference implementation does. It binds them instead to the REST
  endpoint PATHS the provider documents, which is the strongest binding the
  published material supports. Confidence is set accordingly and nothing was
  invented: every path below was read either from the provider's API reference or
  from the compiled site bundle that reference renders from, and every one of them
  was probed live (all return HTTP 401 "Missing authorization header" unauthenticated,
  which confirms they exist and are gated rather than absent).
