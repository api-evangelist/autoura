  - description: ten food stops for a group of friends
    url: 'https://api.autoura.com/api/stops/search?stop_types=food&group_context=friends&limit=10'
runnable_examples_note: >-
  Published verbatim in the API reference, which renders live results from them on
  the docs page itself.
live_demonstrations:
  - name: Uptaste
    url: https://www.uptaste.com
    what: >-
      Autoura's own food-tour brand, published as a worked example of building on the
      API. The preference-sharing QR flow is live in the top right corner.
  - name: MoveMeAlong
    url: https://www.movemealong.com/
    what: Consumer surface for creating MoveMe audio experiences.
  - name: PlanMyVisit
    url: https://www.planmyvisit.to/
    what: The consumer visit-planning surface the MCP tools drive.
agent_sandbox:
  available: false
  note: >-
    There is no unauthenticated or test path into the MCP endpoint. An agent must hold
    a real account: either an OAuth client through dynamic registration, or an
    email-code token bound to a real human account. tools/list returns 401 anonymously,
    so even the tool schemas cannot be read without onboarding.
gaps:
  - id: shared-test-key
    severity: medium
    detail: >-
      One key published for everyone means no per-integrator isolation, no way to
      rotate for a single consumer, and no way to tell evaluation traffic apart from
      anyone else's.
  - id: no-test-mode
    severity: medium
    detail: >-
      Nothing lets an integrator exercise the write surface -- profile creation,
      identity invites, visit plans -- without touching production.
