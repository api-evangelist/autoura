generated: '2026-09-13'
method: searched
source: https://www.autoura.com/docs/api/authentication
note: >-
  Autoura publishes a SHARED PUBLIC TEST API KEY on its authentication page and
  invites anyone to use it. That is the whole of its sandbox posture -- there is no
  separate test environment, no test-vs-live mode, no key prefix separating them, and
  no fixture or trigger tooling. The published key is recorded verbatim below because
  the provider publishes it in the clear as documentation; it is not a credential
  obtained by any other means.
test_vs_live:
  separated: false
  key_prefixes: none
  modes: none
  note: >-
    The test key is a real key against real data on the production host. Autoura's own
    framing is "You can use our test API key if you just want to kick the tyres".
    There is no sandbox host: every documented example calls https://api.autoura.com
    directly.
credentials:
  - kind: api-key
    value: 7757a1969aaba8c3f8e717ffa462fe
    scope: read-only evaluation of the public content APIs
    header: 'Authorization: Bearer 7757a1969aaba8c3f8e717ffa462fe'
    published_at: https://www.autoura.com/docs/api/authentication
    note: >-
      Published by Autoura in its public documentation. Autoura states explicitly that
      API keys are expected to be used in client-side code and that "there is no method
      to access customer details or other GDPR related information with these API keys".
verification:
  endpoint: https://api.autoura.com/api/whoami
  why: >-
    The only endpoint Autoura leaves out of the Fastly cache, so it is the one true
    test of whether a credential is actually working. Autoura warns that other
    endpoints "may be cached hence may appear they work".
runnable_examples:
